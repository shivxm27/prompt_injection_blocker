<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
  <link rel="stylesheet" href="popup.css"/>
  <title>Prompt Injection Blocker</title>
</head>
<body>
<div class="shell">

  <header>
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
          <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
          <line x1="12" y1="9" x2="12" y2="13"/>
          <line x1="12" y1="17" x2="12.01" y2="17"/>
        </svg>
      </div>
      <div>
        <span class="brand-name">Injection Blocker</span>
        <span class="brand-sub">for Coursera</span>
      </div>
    </div>
    <div class="chip" id="chip">
      <span class="chip-dot"></span>
      <span id="chip-label">Active</span>
    </div>
  </header>

  <div class="toggle-card">
    <div>
      <span class="tg-title">Protection enabled</span>
      <span class="tg-sub">Scan clipboard on every copy</span>
    </div>
    <label class="sw">
      <input type="checkbox" id="tog" checked/>
      <span class="sw-track"><span class="sw-thumb"></span></span>
    </label>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-n" id="s-today">0</span>
      <span class="stat-l">Caught today</span>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="stat-n" id="s-patterns">10</span>
      <span class="stat-l">Patterns</span>
    </div>
    <div class="stat-sep"></div>
    <div class="stat">
      <span class="stat-n">MV3</span>
      <span class="stat-l">Manifest</span>
    </div>
  </div>

  <div class="how">
    <div class="how-row">
      <span class="how-n">1</span>
      <span class="how-t">Copy text on <b>coursera.org</b></span>
    </div>
    <div class="how-arrow">↓</div>
    <div class="how-row">
      <span class="how-n">2</span>
      <span class="how-t">Clipboard is scanned instantly</span>
    </div>
    <div class="how-arrow">↓</div>
    <div class="how-row">
      <span class="how-n">3</span>
      <span class="how-t">Injection stripped silently ✓</span>
    </div>
  </div>

  <footer>
    <button class="fbtn" id="open-settings">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="3"/>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
      </svg>
      Manage Patterns
    </button>
    <a class="fbtn" href="https://github.com/shivxm27/prompt-injection-blocker" target="_blank">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 .5C5.65.5.5 5.65.5 12c0 5.1 3.29 9.4 7.86 10.93.57.1.78-.25.78-.55v-2.1c-3.19.69-3.87-1.54-3.87-1.54-.52-1.34-1.28-1.69-1.28-1.69-1.05-.71.08-.7.08-.7 1.16.08 1.77 1.19 1.77 1.19 1.03 1.76 2.7 1.25 3.36.96.1-.75.4-1.25.73-1.54-2.55-.29-5.23-1.27-5.23-5.66 0-1.25.45-2.27 1.18-3.07-.12-.29-.51-1.45.11-3.03 0 0 .96-.31 3.15 1.18a10.96 10.96 0 0 1 5.74 0c2.18-1.49 3.14-1.18 3.14-1.18.63 1.58.23 2.74.11 3.03.74.8 1.18 1.82 1.18 3.07 0 4.4-2.69 5.37-5.25 5.65.41.36.78 1.07.78 2.15v3.19c0 .31.2.66.79.55A11.51 11.51 0 0 0 23.5 12C23.5 5.65 18.35.5 12 .5z"/>
      </svg>
      GitHub
    </a>
  </footer>

</div>
<script src="popup.js"></script>
</body>
</html>
